<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>邀请码签发 · 管理</title>
<style>
  :root {
    --accent: #185FA5;
    --text-1: #1a1a1a; --text-2: #555; --text-3: #999;
    --bg: #f7f7f5; --card: #fff; --border: rgba(0,0,0,.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text-1); font-size: 14px; line-height: 1.6; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--text-3); font-size: 13px; margin-bottom: 18px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 14px; }
  .card h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  label { display: block; font-size: 12px; color: var(--text-2); margin: 10px 0 4px; }
  input[type=text], input[type=password], input[type=number] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 13px; font-family: inherit; background: #fff; color: var(--text-1);
  }
  .row { display: grid; grid-template-columns: 1fr 120px; gap: 12px; }
  .inline { display:flex; align-items:center; gap:6px; margin-top:8px; }
  .inline label { margin:0; }
  .btn { display: inline-block; padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border); background: #fff; color: var(--text-1); font-size: 13px; cursor: pointer; text-decoration: none; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { opacity: .9; color: #fff; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .log { font-size: 13px; margin: 10px 0 0; min-height: 18px; }
  .log .ok { color: #1a7f37; } .log .err { color: #c00; }
  .muted { color: var(--text-3); font-size: 12px; }
  .privacy { font-size: 12px; color: var(--text-3); margin-top: 8px; }
  .hidden { display: none; }
  .code-box { font-family: ui-monospace, Menlo, Consolas, monospace; background:#f0f0ee; border:1px solid var(--border); border-radius:6px; padding:10px 12px; font-size:13px; word-break:break-all; margin:4px 0 8px; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; }
  .issued { border-top:1px solid var(--border); padding-top:10px; margin-top:4px; font-size:13px; }
  .issued .item { padding:8px 0; border-bottom:1px dashed var(--border); }
  .issued .item:last-child { border-bottom:none; }
  .issued .lbl { color: var(--text-2); }
  .issued .c { font-family: ui-monospace, Menlo, Consolas, monospace; word-break:break-all; }
  .warn { background:#fff8e6; border:1px solid #f0c36d; border-radius:8px; padding:10px 12px; font-size:12px; color:#7a5b12; margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>邀请码<span>签发</span></h1>
  <div class="sub">给灰度测试者发放一次性邀请码 · 无需 WorkBuddy，浏览器直接用</div>

  <div class="card">
    <h2>管理员口令</h2>
    <label>口令（仅你知道，服务端校验）</label>
    <input type="password" id="adminToken" placeholder="粘贴管理员口令" autocomplete="off">
    <div class="inline"><input type="checkbox" id="remember"><label for="remember">本次会话记住口令（关闭标签页即清除）</label></div>
    <div class="privacy">口令只在本浏览器标签页内保存，刷新页面不丢、关闭即清。切勿写进聊天或公开场合。</div>
  </div>

  <div class="card">
    <h2>生成一次性邀请码</h2>
    <div class="row">
      <div>
        <label>备注（给自己记是发给谁的，别填隐私）</label>
        <input type="text" id="label" placeholder="例：张三 / 内推群A" maxlength="80">
      </div>
      <div>
        <label>有效天数（1-30）</label>
        <input type="number" id="days" value="7" min="1" max="30">
      </div>
    </div>
    <div class="actions" style="margin-top:14px">
      <button class="btn primary" id="gen">生成邀请码</button>
    </div>
    <div class="log" id="log"></div>

    <div id="result" class="hidden">
      <label>邀请码（仅显示这一次，请立刻复制）</label>
      <div class="code-box" id="code"></div>
      <div class="actions">
        <button class="btn" id="copyCode">复制邀请码</button>
        <button class="btn primary" id="copyShare">复制完整分享文案</button>
      </div>
      <div class="muted" id="expiry" style="margin-top:8px"></div>
    </div>
    <div class="warn">每个码只能兑换一次、兑换后即失效；请私下（私聊/邮件）单独发给每个人，不要发公开群——明文泄露会被人占用模型额度。</div>
  </div>

  <div class="card hidden" id="issuedCard">
    <h2>本次会话已生成（不落库，刷新清空）</h2>
    <div class="issued" id="issued"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const KEY = "resume_admin_token";
const RESUME_URL = location.origin + "/resume.html";

// 恢复本会话记住的口令
const saved = sessionStorage.getItem(KEY);
if (saved) { $("adminToken").value = saved; $("remember").checked = true; }

$("remember").onchange = () => {
  if ($("remember").checked) sessionStorage.setItem(KEY, $("adminToken").value.trim());
  else sessionStorage.removeItem(KEY);
};

function setLog(msg, cls) { $("log").innerHTML = cls ? `<span class="${cls}">${msg}</span>` : msg; }

function fmtDate(ts) {
  const d = new Date(ts * 1000);
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function shareText(code, days) {
  return [
    "【秋招简历定制 · 邀请体验】",
    "打开地址：" + RESUME_URL,
    "邀请码：" + code,
    `有效期 ${days} 天，仅限一次使用。`,
    "用法：打开地址 → 填入邀请码 → 填写经历和岗位 JD → 生成并下载单页 PDF。",
  ].join("\n");
}

async function copy(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const t = document.createElement("textarea");
    t.value = text; document.body.appendChild(t); t.select();
    document.execCommand("copy"); t.remove();
  }
  const old = btn.textContent; btn.textContent = "已复制 ✓";
  setTimeout(() => (btn.textContent = old), 1500);
}

let lastCode = "", lastDays = 7;

$("gen").onclick = async () => {
  const token = $("adminToken").value.trim();
  const label = $("label").value.trim();
  const days = parseInt($("days").value, 10) || 7;
  if (!token) { setLog("请先填写管理员口令", "err"); return; }
  if (!label) { setLog("请填写备注，便于记录发给了谁", "err"); return; }
  if ($("remember").checked) sessionStorage.setItem(KEY, token);
  $("gen").disabled = true; setLog("正在生成…");
  try {
    const r = await fetch("/api/admin/invite", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ label, days }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      const map = { 401: "管理员口令无效", 429: "尝试过多或已被锁定，请稍后再试", 503: "服务端未启用自助发码（未配置管理员口令）" };
      setLog(map[r.status] || (data.detail || ("生成失败，HTTP " + r.status)), "err");
      return;
    }
    lastCode = data.code; lastDays = data.days;
    $("code").textContent = data.code;
    $("expiry").textContent = "标签：" + data.label + "　过期时间：" + fmtDate(data.expires_at);
    $("result").classList.remove("hidden");
    setLog("已生成，请立刻复制（刷新后取不回）", "ok");
    const item = document.createElement("div");
    item.className = "item";
    item.innerHTML = `<span class="lbl">${data.label}（${data.days}天）：</span><span class="c">${data.code}</span>`;
    $("issued").prepend(item);
    $("issuedCard").classList.remove("hidden");
    $("label").value = "";
  } catch {
    setLog("网络错误，请检查地址或稍后重试", "err");
  } finally {
    $("gen").disabled = false;
  }
};

$("copyCode").onclick = () => copy(lastCode, $("copyCode"));
$("copyShare").onclick = () => copy(shareText(lastCode, lastDays), $("copyShare"));
</script>
</body>
</html>
